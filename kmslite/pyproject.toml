[tool.poetry]
name = "kmslite"
version = "0.1.0"
description = "External key-holder integration for ACA-Py (PKCS#11 HSM + X.509 enrollment)"
authors = []

[tool.poetry.dependencies]
python = "^3.13"

# Define ACA-Py as an optional/extra dependency so it can be
# explicitly installed with the plugin if desired.
# Local editable checkout: pulls the kmslite-branch changes
# (SignerRegistry + concrete BaseWallet.sign_message).
acapy-agent = { path = "../../acapy", develop = true, optional = true }

# PKCS#11 signer backend (Luna, BouncyHSM, ...). Required — PKCS#11 is the
# only signer implementation shipped today; future protocols will slot in
# alongside without displacing it.
python-pkcs11 = "^0.7.0"

[tool.poetry.extras]
aca-py = ["acapy-agent"]

[tool.poetry.group.dev.dependencies]
ruff = "^0.15.21"
pytest = "^9.1.1"
pytest-asyncio = "^1.2.0"
pytest-cov = "^5.0.0"
pytest-ruff = "^0.4.1"

[tool.poetry.group.integration.dependencies]
aries-askar = { version = "~0.5.0" }
indy-credx = { version = "~1.1.1" }
indy-vdr = { version = "~0.4.1" }
python3-indy = { version = "^1.11.1" }
anoncreds = { version = "0.2.3" }

[tool.ruff]
line-length = 90

[tool.ruff.lint]
select = ["E", "F", "C", "D"]
ignore = [
    # Google Python Doc Style
    "D203",
    "D204",
    "D213",
    "D215",
    "D400",
    "D401",
    "D404",
    "D406",
    "D407",
    "D408",
    "D409",
    "D413",
    "D202", # Allow blank line after docstring
    "D104", # Don't require docstring in public package
    "D102", # Public method docstring — @docs(summary=) already documents handlers
    "D103", # Public function docstring — reads worse than a good name
    "D107", # __init__ docstring — class docstring covers it
    # Things that we should fix, but are too much work right now
    "C901",
]

[tool.ruff.lint.per-file-ignores]
"**/{tests}/*" = ["F841", "D", "E501"]
"**/{demo}/*" = ["F841", "D", "E501"]

[tool.pytest.ini_options]
testpaths = "kmslite"
addopts = """
    -p no:warnings
    --quiet --junitxml=./.test-reports/junit.xml
    --cov-config .coveragerc --cov=kmslite --cov-report term --cov-report xml
"""
markers = []
junit_family = "xunit1"
asyncio_mode = "auto"

[tool.coverage.run]
omit = ["*/tests/*", "docker/*", "integration/*", "*/definition.py"]
data_file = ".test-reports/.coverage"

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "@abstract"]
precision = 2
skip_covered = true
show_missing = true

[tool.coverage.xml]
output = ".test-reports/coverage.xml"

[build-system]
requires = ["setuptools", "poetry-core>=2.1"]
build-backend = "poetry.core.masonry.api"
